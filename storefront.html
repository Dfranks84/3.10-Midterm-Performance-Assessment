<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Storefront webpage">
    <meta name="keywords" content="store, products, web development">
    <meta name="author" content="Dennis Franks Jr">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Storefront</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Header -->
    <header>
        <h1>Dennis Franks Jr Store</h1>
    </header>

    <!-- Navigation -->
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Main content -->
    <main>
        <!-- Product section -->
        <section>
            <h2>Store Inventory</h2>

            <table>
                <caption>Store Inventory</caption>

                <colgroup>
                    <col id="firstCol">
                    <col>
                    <col id="thirdCol">
                    <col>
                </colgroup>

                <thead>
                    <tr>
                        <th>Product Name</th>
                        <th>Price</th>
                        <th>Category</th>
                        <th>Availability</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Laptop</td>
                        <td>$900</td>
                        <td>Electronics</td>
                        <td>In Stock</td>
                    </tr>
                    <tr>
                        <td>Headphones</td>
                        <td>$150</td>
                        <td>Accessories</td>
                        <td>In Stock</td>
                    </tr>
                    <tr>
                        <td>Keyboard</td>
                        <td>$80</td>
                        <td>Accessories</td>
                        <td>Out of Stock</td>
                    </tr>
                </tbody>

                <tfoot>
                    <tr>
                        <td colspan="4">Inventory updated regularly</td>
                    </tr>
                </tfoot>
            </table>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Dennis Franks Jr</p>
    </footer>
</body>

</html>
